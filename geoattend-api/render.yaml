# Render Blueprint (free web service). The database lives on Neon, not Render.
services:
  - type: web
    name: geoattend-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COMPANY_NAME
        value: TTNet LTD
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
